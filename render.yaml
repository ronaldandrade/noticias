services:
  - type: web
    name: monitor-financeiro
    runtime: python
    buildCommand: pip install -r requirements.txt && python -c "import nltk; nltk.download('stopwords'); nltk.download('punkt'); nltk.download('punkt_tab')"
    startCommand: flask db upgrade && gunicorn -c gunicorn.conf.py run:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FLASK_DEBUG
        value: "false"
      - key: CRON_SECRET
        sync: false
